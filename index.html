<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campify</title>
<meta name="theme-color" content="#04030c">
<meta name="description" content="Offline music player for your own music.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#04030c;--glass:rgba(22,17,50,.55);--glass2:rgba(60,46,125,.4);--line:rgba(167,139,255,.18);--text:#f5f2ff;--mute:#a29dc9;--hi:#7df3ff;--v:#8b5cff;--pk:#ff4fd8;--grad:linear-gradient(135deg,#8b5cff 0%,#c44dff 50%,#ff4fd8 100%);--grad2:linear-gradient(90deg,#8b5cff,#00e5ff);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#3b3470 transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.i{width:1em;height:1em;fill:currentColor;flex:none;display:block}
h1{font-size:30px;margin:0;letter-spacing:-.025em;background:linear-gradient(90deg,#fff 10%,#cdbcff 60%,#7df3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:19px;margin:0 0 12px;letter-spacing:-.01em}
h3{margin:0 0 14px;font-size:18px}

/* space backdrop */
#nebula{position:fixed;inset:-10%;z-index:0;pointer-events:none;background:
  radial-gradient(60% 50% at 15% 10%,rgba(124,58,237,.40),transparent 70%),
  radial-gradient(50% 45% at 92% 18%,rgba(0,200,255,.20),transparent 70%),
  radial-gradient(55% 50% at 80% 96%,rgba(255,60,200,.26),transparent 70%),
  radial-gradient(45% 40% at 8% 88%,rgba(40,90,255,.28),transparent 70%);
  animation:drift 70s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{to{transform:translate3d(-3%,2%,0) scale(1.1) rotate(2deg)}}
.fx-off #nebula{animation:none}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* layout */
#app{position:relative;z-index:1;height:100dvh;display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"side main" "bar bar"}
#side{grid-area:side;background:rgba(8,6,24,.55);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:20px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line)}
#main{grid-area:main;overflow-y:auto;overscroll-behavior:contain;padding:26px 30px 40px;scroll-behavior:smooth}
#bar{grid-area:bar}
#nav{display:none;grid-area:nav}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em;padding:4px 10px 18px}
.logo img{width:32px;height:32px;border-radius:9px;box-shadow:0 0 18px rgba(139,92,255,.7)}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nl{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:12px;color:var(--mute);font-weight:600;font-size:15px;transition:color .2s,background .2s;text-align:left;width:100%}
.nl .i{font-size:22px;transition:filter .2s,color .2s}
.nl:hover{color:var(--text)}
.nl.on{color:#fff;background:linear-gradient(90deg,rgba(139,92,255,.32),rgba(139,92,255,0))}
.nl.on .i{color:var(--hi);filter:drop-shadow(0 0 7px var(--hi))}
.sp{flex:1}
@media(max-width:899px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;grid-template-areas:"main" "bar" "nav"}
  #side{display:none}
  #main{padding:16px 16px 28px}
  #nav{display:flex;background:rgba(8,6,24,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  #nav .nl{flex-direction:column;gap:3px;font-size:11px;padding:6px 0;justify-content:center;align-items:center;text-align:center;background:none}
  #nav .nl .i{font-size:23px}
  h1{font-size:25px}
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.mobtop{display:none}
@media(max-width:899px){.mobtop{display:flex}}

/* buttons */
.ib{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;font-size:22px;color:var(--mute);transition:color .15s,transform .15s,background .15s;flex:none}
.ib:hover{color:var(--text);background:rgba(139,92,255,.14)}
.ib:active{transform:scale(.9)}
.ib.on{color:var(--hi);filter:drop-shadow(0 0 6px rgba(125,243,255,.7))}
.ib.fav.on{color:var(--pk);filter:drop-shadow(0 0 6px rgba(255,79,216,.7))}
.btn{background:var(--grad);color:#fff;font-weight:700;border-radius:99px;padding:10px 20px;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .2s;box-shadow:0 4px 22px rgba(160,80,255,.45)}
.btn:hover{box-shadow:0 6px 30px rgba(196,77,255,.65)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;box-shadow:none;cursor:default}
.btn.ghost{background:var(--glass2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(90,70,180,.5)}
.btn.danger{background:#e23b5c;box-shadow:0 4px 18px rgba(226,59,92,.4)}
.btn .i{font-size:20px}
.play{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:26px;transition:transform .15s;flex:none;box-shadow:0 0 22px rgba(160,80,255,.6)}
.play:hover{transform:scale(1.07)}
.play:active{transform:scale(.94)}
body.is-playing .play{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 18px rgba(160,80,255,.55)}50%{box-shadow:0 0 34px rgba(255,79,216,.8),0 0 8px rgba(125,243,255,.6)}}
.rep[data-m="2"]::after{content:"1";position:absolute;right:6px;top:5px;font-size:9px;font-weight:800;color:#04030c;background:var(--hi);border-radius:50%;width:12px;height:12px;display:grid;place-items:center;line-height:1}

/* lists */
.row{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 8px;border-radius:12px;cursor:pointer;transition:background .15s}
.row:hover{background:rgba(139,92,255,.13)}
.row:active{background:rgba(139,92,255,.22)}
.row .meta{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.playing{background:linear-gradient(90deg,rgba(0,229,255,.13),rgba(139,92,255,.05) 70%,transparent)}
.row.playing .t{color:var(--hi);text-shadow:0 0 14px rgba(125,243,255,.5)}
.rdur{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.thw{position:relative;width:46px;height:46px;flex:none;border-radius:9px;overflow:hidden}
.th{width:100%;height:100%;display:grid;place-items:center;background:
  radial-gradient(circle at 30% 28%,hsl(var(--h,120) 85% 68%),hsl(calc(var(--h,120) + 55) 70% 34%) 48%,hsl(calc(var(--h,120) + 90) 65% 11%) 100%);
  color:#fff;font-weight:800;font-size:20px;overflow:hidden;border-radius:inherit;text-shadow:0 2px 8px #0008}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .i{font-size:40%;opacity:.95}
.th.favth{background:var(--grad);color:#fff}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding:12px 14px;background:#04030cc0}
.row.playing .eq{display:flex}
.eq b{width:4px;background:linear-gradient(var(--hi),var(--v));height:25%;border-radius:2px;animation:eq 1s infinite ease-in-out;animation-play-state:paused}
body.is-playing .eq b{animation-play-state:running}
.eq b:nth-child(2){animation-delay:-.35s}.eq b:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
@media(max-width:899px){.row .ib.fav{display:none}}

/* cards */
.hs{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:4px 16px 10px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.card{width:144px;flex:none;text-align:left;padding:10px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:rgba(167,139,255,.5);box-shadow:0 12px 34px rgba(139,92,255,.28)}
.card .cv{aspect-ratio:1;border-radius:11px;overflow:hidden;margin-bottom:10px;box-shadow:0 6px 18px #0009}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.grid .card{width:auto}
section{margin-bottom:30px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:30px}
.tile{display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding-right:10px;font-weight:700;text-align:left;transition:background .2s,transform .2s,box-shadow .2s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tile:hover{background:var(--glass2);box-shadow:0 6px 24px rgba(139,92,255,.3);transform:translateY(-1px)}
.tile .cv{width:56px;height:56px;flex:none}
.tile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:899px){.quick{grid-template-columns:1fr 1fr}.tile{font-size:13px}}

/* empty / hints */
.empty{text-align:center;padding:48px 20px;background:var(--glass);border-radius:22px;border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.empty .big{font-size:50px;color:var(--hi);display:grid;place-items:center;margin-bottom:10px;filter:drop-shadow(0 0 16px rgba(125,243,255,.7));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.empty p{color:var(--mute);margin:6px auto 18px;max-width:420px}
.hint{color:var(--mute);padding:20px 4px}
.sbox{display:flex;align-items:center;gap:10px;background:var(--glass2);border-radius:99px;padding:0 16px;margin-bottom:20px;font-size:20px;color:var(--mute);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s}
.sbox:focus-within{border-color:var(--v);color:var(--hi);box-shadow:0 0 0 3px rgba(139,92,255,.25)}
.sbox input{flex:1;background:none;border:0;outline:0;padding:13px 0;font-size:16px;min-width:0;user-select:text;-webkit-user-select:text}
.sbox input::-webkit-search-cancel-button{filter:invert(1)}
.sbox.sm{margin-bottom:10px;font-size:18px}
.sbox.sm input{padding:10px 0}
select{background:var(--glass2);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:8px 12px;font:inherit;font-size:13px}
select option{background:#14102e}
.ph-head{display:flex;gap:22px;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap}
.ph-head .cv{width:min(200px,42vw);aspect-ratio:1;border-radius:16px;overflow:hidden;box-shadow:0 10px 50px rgba(139,92,255,.45),0 0 0 1px var(--line)}
.ph-head .info{flex:1;min-width:180px}
.ph-head h1{font-size:clamp(26px,5vw,50px);word-break:break-word}
.ph-head .sub{color:var(--mute);margin:6px 0 14px}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumb{display:none;margin-bottom:8px}
@media(max-width:899px){.crumb{display:grid}}

/* player bar */
#bar{display:grid;grid-template-columns:1fr minmax(320px,560px) 1fr;align-items:center;gap:16px;padding:10px 18px;background:rgba(6,4,20,.72);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-top:1px solid var(--line);position:relative}
body:not(.has-song) #bar{display:none}
.bi{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.bi .thw{width:54px;height:54px;box-shadow:0 0 18px rgba(139,92,255,.4)}
.bi .meta{min-width:0}
.bc{display:flex;flex-direction:column;gap:2px}
.ctl{display:flex;align-items:center;justify-content:center;gap:10px}
.seekrow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.seekrow span{min-width:36px}
.seekrow .tcur{text-align:right}
.bx{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.bx .vol{width:110px}
.mprog{display:none}
@media(max-width:899px){
  #bar{grid-template-columns:minmax(0,1fr) auto;margin:0 8px 6px;border:1px solid var(--line);border-radius:16px;background:rgba(24,18,56,.78);padding:8px 10px;gap:6px;overflow:hidden;box-shadow:0 6px 28px rgba(80,40,200,.35)}
  .bi .thw{width:42px;height:42px}
  .bc .seekrow,.dsk,.bx{display:none}
  .mprog{display:block;position:absolute;left:10px;right:10px;bottom:0;height:2px;background:rgba(255,255,255,.12)}
  .mprog i{display:block;height:100%;width:0;background:var(--grad2);box-shadow:0 0 8px var(--hi)}
  .play{width:40px;height:40px;font-size:24px}
}

/* ranges */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:20px;width:100%;margin:0;--p:0%;cursor:pointer;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#8b5cff,#00e5ff) 0 0/var(--p) 100% no-repeat,rgba(255,255,255,.15)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;margin-top:-4.5px;box-shadow:0 0 10px var(--hi);transform:scale(0);transition:transform .15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb,#np input[type=range]::-webkit-slider-thumb{transform:scale(1)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.15)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--grad2)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--hi)}
input[type=range]:focus{outline:0}

/* now playing */
#np{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 24px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(hsl(var(--h,260) 65% 16% / .86),rgba(4,3,12,.94) 78%);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);transform:translateY(100%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s .4s;overflow:hidden}
#np::before{content:"";position:absolute;inset:-25%;background:var(--art,none) center/cover;filter:blur(70px) saturate(1.7);opacity:.4;pointer-events:none}
#np.open{transform:none;visibility:visible;transition:transform .4s var(--ease)}
#np .in{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;gap:14px}
.nph{display:flex;align-items:center;justify-content:space-between;text-align:center}
.nph small{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.14em}
.nph b{font-size:13px}
.npc{flex:1;min-height:0;display:grid;place-items:center}
.npc .cv{width:min(100%,46vh);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px rgba(167,139,255,.35),0 0 70px hsl(var(--h,260) 90% 58% / .55),0 24px 60px #000b;transition:transform .5s var(--ease),border-radius .5s var(--ease)}
body.is-playing .npc .cv{animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.npc .cv .th{font-size:80px}
.npt{display:flex;align-items:center;gap:12px}
.npt .meta{flex:1;min-width:0}
.npt .t{font-size:22px}
.npt .a{font-size:15px}
.npctl{display:flex;align-items:center;justify-content:space-between}
.npctl .ib{font-size:26px}
.npctl .play{width:66px;height:66px;font-size:34px}
.npv{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:20px}

/* sheet / toast */
#sheet{position:fixed;inset:0;z-index:60;visibility:hidden}
#sheet.open{visibility:visible}
.scrim{position:absolute;inset:0;background:rgba(2,1,10,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .25s}
#sheet.open .scrim{opacity:1}
.panel{position:absolute;left:50%;bottom:0;width:min(520px,100%);max-height:85dvh;overflow-y:auto;background:rgba(18,13,44,.9);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,100%);transition:transform .3s var(--ease);box-shadow:0 -10px 60px rgba(100,50,220,.3)}
#sheet.open .panel{transform:translate(-50%,0)}
@media(min-width:900px){.panel{bottom:auto;top:50%;border-bottom:1px solid var(--line);border-radius:24px;transform:translate(-50%,-40%);opacity:0;transition:transform .3s var(--ease),opacity .2s}#sheet.open .panel{transform:translate(-50%,-50%);opacity:1}}
.sh-head{display:flex;gap:12px;align-items:center;padding:0 4px 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.sh-head .thw{width:48px;height:48px}
.sh-head span{display:block;color:var(--mute);font-size:13px}
.panel>button,.panel .opt{display:flex;align-items:center;gap:16px;width:100%;padding:13px 10px;border-radius:12px;text-align:left;font-size:15px}
.panel>button:hover,.panel .opt:hover{background:rgba(139,92,255,.16)}
.panel>button .i,.panel .opt .i{font-size:22px;color:var(--mute)}
.panel .danger{color:#ff6b8a}
.panel .danger .i{color:#ff6b8a}
.opt>span{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt small{display:block;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.pickwrap{max-height:46dvh;overflow-y:auto;margin:0 -6px}
.pick{cursor:pointer}
.pick .chk{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid rgba(167,139,255,.35);display:grid;place-items:center;flex:none;transition:all .15s}
.panel .pick .chk .i{font-size:16px;color:#04030c}
.pick.sel .chk{background:var(--grad2);border-color:transparent;box-shadow:0 0 12px rgba(0,229,255,.6)}
.pick.in{opacity:.5}
.pick.in .chk{background:var(--mute);border-color:transparent}
.fld{display:block;margin-bottom:12px;color:var(--mute);font-size:13px}
.fld input{display:block;width:100%;margin-top:6px;background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;color:var(--text);outline:0;user-select:text;-webkit-user-select:text}
.fld input:focus{border-color:var(--v);box-shadow:0 0 0 3px rgba(139,92,255,.25)}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.panel p{color:var(--mute);margin:0 0 14px}
.kv{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid var(--line);color:var(--mute)}
.kv b{color:var(--text);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(30,22,70,.92);border:1px solid rgba(167,139,255,.4);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:70;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(100,50,220,.45)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#drop{position:fixed;inset:12px;border:2px dashed var(--hi);border-radius:22px;background:rgba(4,3,12,.85);z-index:80;display:none;place-items:center;font-size:22px;font-weight:700;color:var(--hi)}
#drop.on{display:grid}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="nebula"></div><canvas id="stars"></canvas>
<div id="app">
  <aside id="side">
    <div class="logo"><img src="icon-192.png" alt=""><div>Camp<span>ify</span></div></div>
    <button class="nl" data-go="home" data-ic="home"></button>
    <button class="nl" data-go="search" data-ic="search"></button>
    <button class="nl" data-go="library" data-ic="music"></button>
    <button class="nl" data-go="playlists" data-ic="queue"></button>
    <div class="sp"></div>
    <button class="nl" data-c="import" data-ic="plus"></button>
    <button class="nl" data-c="settings" data-ic="settings"></button>
  </aside>
  <main id="main"></main>
  <div id="bar">
    <div class="bi" data-c="open">

const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;

/* ---------- storage (IndexedDB) ---------- */
let db;
const openDB=()=>new Promise((ok,no)=>{const r=indexedDB.open('campify',1);
  r.onupgradeneeded=()=>{const d=r.result;['songs','blobs','playlists'].forEach(n=>d.createObjectStore(n,{keyPath:'id'}));d.createObjectStore('meta',{keyPath:'k'})};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const rq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const os=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const dbAll=n=>rq(os(n).getAll()),dbGet=(n,k)=>rq(os(n).get(k)),dbPut=(n,v)=>rq(os(n,'readwrite').put(v)),dbDel=(n,k)=>rq(os(n,'readwrite').delete(k));
const txDone=(names,fn)=>new Promise((ok,no)=>{const t=db.transaction(names,'readwrite');fn(t);t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});

/* ---------- state ---------- */
const S={songs:new Map(),pl:[],route:{n:'home'},q:{base:[],order:[],pos:-1,ctx:'Library'},cur:null,shuffle:false,repeat:0,vol:1,query:'',sort:'recent',drag:false};
const A=new Audio();A.preload='auto';
let curUrl=null,playTok=0,errRun=0,deferredInstall=null,npOpen=false;
const covers=new Map();
const coverUrl=s=>{if(!s||!s.cover)return null;let u=covers.get(s.id);if(!u){u=URL.createObjectURL(s.cover);covers.set(s.id,u)}return u};
const thumb=s=>{const u=coverUrl(s);return `<div class="th" style="--h:${hue(s.title+s.artist)}">${u?`<img src="${u}" alt="" loading="lazy">`:`<span>${esc((s.title[0]||'♪').toUpperCase())}</span>`}</div>`};
const sorted=(arr,k)=>[...arr].sort(k==='title'?(a,b)=>a.title.localeCompare(b.title):k==='artist'?(a,b)=>a.artist.localeCompare(b.artist)||a.title.localeCompare(b.title):(a,b)=>b.added-a.added);
const favIds=()=>sorted([...S.songs.values()].filter(s=>s.fav),'recent').map(s=>s.id);
let prefT;const savePrefs=()=>{clearTimeout(prefT);prefT=setTimeout(()=>{if(db)dbPut('meta',{k:'prefs',vol:S.vol,shuffle:S.shuffle,repeat:S.repeat,q:S.q}).catch(()=>{})},400)};
let toastT;const toast=(m,sticky)=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);if(!sticky)toastT=setTimeout(()=>t.classList.remove('show'),2400)};

/* ---------- tag reading ---------- */
function decText(b){const enc=b[0];let d=b.subarray(1),lab='iso-8859-1';
  if(enc===1){if(d[0]===0xFF&&d[1]===0xFE){lab='utf-16le';d=d.subarray(2)}else if(d[0]===0xFE&&d[1]===0xFF){lab='utf-16be';d=d.subarray(2)}else lab='utf-16le'}
  else if(enc===2)lab='utf-16be';else if(enc===3)lab='utf-8';
  return new TextDecoder(lab).decode(d).split('\0')[0].trim()}
async function readTags(file){const out={};
  try{
    const h=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(h[0]!==0x49||h[1]!==0x44||h[2]!==0x33||(h[3]!==3&&h[3]!==4))return out;
    const ver=h[3],size=((h[6]&127)<<21)|((h[7]&127)<<14)|((h[8]&127)<<7)|(h[9]&127);
    const buf=new Uint8Array(await file.slice(10,10+Math.min(size,6e6)).arrayBuffer()),dv=new DataView(buf.buffer);
    let p=0;
    while(p+10<=buf.length){
      const id=String.fromCharCode(buf[p],buf[p+1],buf[p+2],buf[p+3]);
      if(!/^[A-Z0-9]{4}$/.test(id))break;
      const fs=ver===4?((buf[p+4]&127)<<21)|((buf[p+5]&127)<<14)|((buf[p+6]&127)<<7)|(buf[p+7]&127):dv.getUint32(p+4);
      if(fs<=0||p+10+fs>buf.length)break;
      const body=buf.subarray(p+10,p+10+fs);
      if(id==='TIT2')out.title=decText(body);
      else if(id==='TPE1')out.artist=decText(body);
      else if(id==='TALB')out.album=decText(body);
      else if(id==='APIC'&&!out.cover&&fs<4e6){
        const enc=body[0];let i=1;while(i<body.length&&body[i]!==0)i++;
        const mime=String.fromCharCode(...body.subarray(1,i));i+=2;
        if(enc===1||enc===2){while(i+1<body.length&&!(body[i]===0&&body[i+1]===0))i+=2;i+=2}else{while(i<body.length&&body[i]!==0)i++;i++}
        if(i<body.length)out.cover=new Blob([body.slice(i)],{type:/^image\//.test(mime)?mime:'image/jpeg'});
      }
      p+=10+fs;
    }
  }catch(e){}
  return out}
function nameGuess(fn){const n=fn.replace(/\.[^.]+$/,'').replace(/_/g,' ').replace(/^\d{1,3}[\s.\-]+(?=\D)/,'').trim();const m=n.split(/\s+-\s+/);
  return m.length>=2?{artist:m[0].trim(),title:m.slice(1).join(' - ').trim()}:{artist:'Unknown artist',title:n||fn}}
const MIME={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',flac:'audio/flac',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg',weba:'audio/webm'};
function getDuration(blob){return new Promise(r=>{const a=new Audio(),u=URL.createObjectURL(blob);let done=false;
  const fin=d=>{if(done)return;done=true;URL.revokeObjectURL(u);a.removeAttribute('src');r(d)};
  a.preload='metadata';a.onloadedmetadata=()=>fin(isFinite(a.duration)?a.duration:0);a.onerror=()=>fin(0);setTimeout(()=>fin(0),8000);a.src=u})}

async function importFiles(list){
  const files=[...list].filter(f=>/^audio\//.test(f.type)||/\.(mp3|m4a|aac|wav|flac|ogg|oga|opus|weba)$/i.test(f.name));
  if(!files.length){toast('No audio files found');return}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  const have=new Set([...S.songs.values()].map(s=>s.key));let n=0,dup=0,bad=0;
  for(let i=0;i<files.length;i++){
    const f=files[i],key=f.name+'|'+f.size;
    toast(`Importing ${i+1} of ${files.length}…`,true);
    if(have.has(key)){dup++;continue}
    try{
      const ext=(f.name.split('.').pop()||'').toLowerCase(),blob=f.type?f:new Blob([f],{type:MIME[ext]||'audio/mpeg'});
      const tags=await readTags(f),g=nameGuess(f.name),dur=await getDuration(blob);
      const s={id:uid(),key,title:tags.title||g.title,artist:tags.artist||g.artist,album:tags.album||'',dur,added:Date.now()+i,fav:false,cover:tags.cover||null,size:f.size};
      await txDone(['songs','blobs'],t=>{t.objectStore('songs').put(s);t.objectStore('blobs').put({id:s.id,blob})});
      S.songs.set(s.id,s);have.add(key);n++;
    }catch(e){bad++;if(e&&e.name==='QuotaExceededError'){toast('Device storage is full');break}}
  }
  toast(`Added ${n} song${n===1?'':'s'}${dup?` · ${dup} already in library`:''}${bad?` · ${bad} failed`:''}`);
  render();
}

/* ---------- queue & playback ---------- */
function buildOrder(first){const b=S.q.base;
  if(S.shuffle){const rest=b.filter(x=>x!==first);shuf(rest);S.q.order=first?[first,...rest]:rest}else S.q.order=[...b]}
function startQueue(ids,startId,ctx){if(!ids.length)return;S.q.base=[...ids];S.q.ctx=ctx||'Library';buildOrder(startId);playAt(Math.max(0,S.q.order.indexOf(startId)))}
function shuffleStart(ids,ctx){if(!ids.length)return;S.shuffle=true;startQueue(ids,ids[Math.floor(Math.random()*ids.length)],ctx)}
async function playAt(pos){
  const id=S.q.order[pos];const song=S.songs.get(id);if(!song)return;
  S.q.pos=pos;S.cur=id;const tok=++playTok;
  updateMeta(song);ui();markPlaying();
  let rec;try{rec=await dbGet('blobs',id)}catch(e){}
  if(tok!==playTok)return;
  if(!rec){toast('Audio file missing');return}
  if(curUrl)URL.revokeObjectURL(curUrl);
  curUrl=URL.createObjectURL(rec.blob);A.src=curUrl;A.loop=S.repeat===2;
  try{await A.play()}catch(e){}
  savePrefs();
}
function toggle(){if(!S.cur)return;if(!A.src){playAt(S.q.pos);return}A.paused?A.play().catch(()=>{}):A.pause()}
function next(auto){const q=S.q;if(!q.order.length)return;
  let p=q.pos+1;
  if(p>=q.order.length){
    if(S.repeat===1||!auto){if(S.shuffle)buildOrder(null);p=0}
    else{A.pause();A.currentTime=0;ui();return}
  }
  playAt(p)}
function prev(){const q=S.q;if(!q.order.length)return;if(A.currentTime>3){A.currentTime=0;return}
  if(q.pos>0)return playAt(q.pos-1);if(S.repeat===1)return playAt(q.order.length-1);A.currentTime=0}
function toggleShuffle(){S.shuffle=!S.shuffle;const q=S.q;
  if(q.order.length){if(S.shuffle){buildOrder(S.cur);q.pos=Math.max(0,q.order.indexOf(S.cur))}else{q.order=[...q.base];q.pos=Math.max(0,q.order.indexOf(S.cur))}}
  ui();savePrefs()}
function cycleRepeat(){S.repeat=(S.repeat+1)%3;A.loop=S.repeat===2;ui();savePrefs();toast(['Repeat off','Repeat all','Repeat one'][S.repeat])}
function enqueue(id,nextUp){const q=S.q;if(!q.order.length){startQueue([id],id,'Queue');return}
  q.order.splice(nextUp?q.pos+1:q.order.length,0,id);
  const bi=q.base.indexOf(S.cur);q.base.splice(nextUp&&bi>=0?bi+1:q.base.length,0,id);
  toast(nextUp?'Playing next':'Added to queue');savePrefs()}

A.addEventListener('play',()=>{ui();if('mediaSession'in navigator)navigator.mediaSession.playbackState='playing'});
A.addEventListener('pause',()=>{ui();if('mediaSession'in navigator)navigator.mediaSession.playbackState='paused'});
A.addEventListener('ended',()=>next(true));
A.addEventListener('playing',()=>{errRun=0});
A.addEventListener('loadedmetadata',()=>{tick();posState()});
A.addEventListener('error',()=>{if(!A.src)return;toast("Can't play this file");if(++errRun<4&&S.q.order.length>1)setTimeout(()=>next(true),700)});
let lastPos=0;A.addEventListener('timeupdate',()=>{tick();const n=Date.now();if(n-lastPos>1000){lastPos=n;posState()}});
function posState(){try{if('mediaSession'in navigator&&isFinite(A.duration)&&A.duration>0)navigator.mediaSession.setPositionState({duration:A.duration,position:Math.min(A.currentTime,A.duration),playbackRate:A.playbackRate||1})}catch(e){}}
function updateMeta(s){if(!('mediaSession'in navigator))return;
  const u=coverUrl(s);
  navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,album:s.album||'Campify',artwork:u?[{src:u,sizes:'512x512',type:s.cover.type||'image/jpeg'}]:[{src:new URL('icon-512.png',location.href).href,sizes:'512x512',type:'image/png'}]})}
if('mediaSession'in navigator){const ms=navigator.mediaSession;
  [['play',()=>toggle()],['pause',()=>A.pause()],['previoustrack',()=>prev()],['nexttrack',()=>next()],
   ['seekbackward',d=>{A.currentTime=Math.max(0,A.currentTime-(d.seekOffset||10))}],
   ['seekforward',d=>{A.currentTime=Math.min(A.duration||1e9,A.currentTime+(d.seekOffset||10))}],
   ['seekto',d=>{if(d.fastSeek&&A.fastSeek)A.fastSeek(d.seekTime);else A.currentTime=d.seekTime}],
   ['stop',()=>{A.pause();A.currentTime=0}]].forEach(([a,f])=>{try{ms.setActionHandler(a,f)}catch(e){}})}

/* ---------- player UI ---------- */
function tick(){const d=A.duration||0,t=A.currentTime||0,p=d?t/d:0,s=S.songs.get(S.cur);

async function addToPl(pid,sid){const p=S.pl.find(x=>x.id===pid);if(!p)return;if(p.ids.includes(sid)){toast('Already in '+p.name);return}p.ids.push(sid);await dbPut('playlists',p);toast('Added to '+p.name);render()}
async function removeFromPl(pid,sid){const p=S.pl.find(x=>x.id===pid);if(!p)return;p.ids=p.ids.filter(x=>x!==sid);await dbPut('playlists',p);render()}
async function deleteSong(id){
  await txDone(['songs','blobs'],t=>{t.objectStore('songs').delete(id);t.objectStore('blobs').delete(id)});
  for(const p of S.pl)if(p.ids.includes(id)){p.ids=p.ids.filter(x=>x!==id);await dbPut('playlists',p)}
  const u=covers.get(id);if(u){URL.revokeObjectURL(u);covers.delete(id)}
  S.songs.delete(id);S.q.base=S.q.base.filter(x=>x!==id);
  if(S.cur===id){const was=S.q.pos;S.q.order=S.q.order.filter(x=>x!==id);playTok++;A.pause();A.removeAttribute('src');A.load();S.cur=null;S.q.pos=Math.min(was,S.q.order.length-1);if(S.q.order.length){S.cur=S.q.order[Math.max(0,S.q.pos)];S.q.pos=Math.max(0,S.q.pos)}}
  else{const c=S.q.order.indexOf(S.cur);S.q.order=S.q.order.filter(x=>x!==id);S.q.pos=S.q.order.indexOf(S.cur);if(c<0)S.q.pos=-1}
  ui();render();savePrefs();toast('Deleted')}

function pickPlaylist(sid){

function pickSongs(pid){
  const p=S.pl.find(x=>x.id===pid);if(!p)return;
  if(!S.songs.size){toast('Add music to your library first');return}
  const sel=new Set();let q='';
  const draw=()=>{const w=$('#pickList'),top=w.scrollTop,list=sorted([...S.songs.values()].filter(s=>!q||(s.title+' '+s.artist+' '+s.album).toLowerCase().includes(q)),'title');

function showQueue(){const q=S.q;if(!q.order.length){toast('Queue is empty');return}

/* ---------- events ---------- */
function listIds(el){const l=el.closest('.list');return $$('.row',l).map(r=>r.dataset.id)}
document.addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');
  if(act){const r=act.closest('.row');if(r){e.stopPropagation();if(act.dataset.act==='fav')toggleFav(r.dataset.id);else songMenu(r.dataset.id,r.closest('.list').dataset.pl||'')}return}
  const c=e.target.closest('[data-c]');if(c){e.stopPropagation();ctl(c.dataset.c);return}
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const sc=e.target.closest('[data-song]');if(sc){const hs=sc.closest('.hs');startQueue($$('[data-song]',hs).map(x=>x.dataset.song),sc.dataset.song,hs.dataset.ctx);return}
  const r=e.target.closest('.row');if(r){const l=r.closest('.list');startQueue(listIds(r),r.dataset.id,l.dataset.ctx)}
});
async function ctl(c){
  const p=S.route.n==='pl'?plData(S.route.id):null;
  switch(c){
    case'open':openNP();break;case'close':closeNP();break;
    case'play':toggle();break;case'next':next();break;case'prev':prev();break;
    case'shuffle':toggleShuffle();break;case'repeat':cycleRepeat();break;
    case'fav':toggleFav(S.cur);break;case'queue':showQueue();break;
    case'import':$('#file').click();break;case'settings':showSettings();break;
    case'install':if(deferredInstall){deferredInstall.prompt();deferredInstall=null;render()}break;
    case'shuffleall':shuffleStart([...S.songs.keys()],'Library');ui();break;
    case'plplay':if(p&&p.ids.length){S.shuffle=false;startQueue(p.ids.filter(i=>S.songs.has(i)),p.ids.find(i=>S.songs.has(i)),p.name)}break;
    case'plshuffle':if(p&&p.ids.length)shuffleStart(p.ids.filter(i=>S.songs.has(i)),p.name);break;
    case'pladd':if(p&&!p.virt)pickSongs(p.id);break;
    case'newpl':{const r=await form('New playlist',[{k:'name',label:'Name',value:''}],'Create');if(r&&r.name){await newPlaylist(r.name);render()}break}
    case'plrename':{const r=await form('Rename playlist',[{k:'name',label:'Name',value:p.name}]);if(r&&r.name){p.name=r.name;await dbPut('playlists',p);render()}break}
    case'pldelete':if(await confirmBox('Delete playlist?',`"${p.name}" will be deleted. Your songs stay in the library.`,'Delete')){await dbDel('playlists',p.id);S.pl=S.pl.filter(x=>x.id!==p.id);go('playlists')}break;
  }}
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){S.query=t.value;$('#results').innerHTML=results()}
  else if(t.classList.contains('seek')){const d=A.duration;if(d){A.currentTime=t.value/1000*d}$$('.seek').forEach(r=>{r.value=t.value;r.style.setProperty('--p',t.value/10+'%')})}
  else if(t.classList.contains('vol')){S.vol=t.value/100;A.volume=S.vol;$$('.vol').forEach(v=>{v.value=t.value;v.style.setProperty('--p',t.value+'%')});savePrefs()}});
document.addEventListener('change',e=>{if(e.target.id==='sort'){S.sort=e.target.value;render()}});
document.addEventListener('pointerdown',e=>{if(e.target.classList&&e.target.classList.contains('seek'))S.drag=true});
document.addEventListener('pointerup',()=>{S.drag=false});
$('#file').addEventListener('change',e=>{const f=e.target.files;if(f&&f.length)importFiles(f);e.target.value=''});
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'&&e.target.type!=='range')return;
  if(e.code==='Space'){e.preventDefault();toggle()}else if(e.shiftKey&&e.code==='ArrowRight')next();else if(e.shiftKey&&e.code==='ArrowLeft')prev()});
let dragN=0;
window.addEventListener('dragenter',e=>{e.preventDefault();dragN++;$('#drop').classList.add('on')});
window.addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;$('#drop').classList.remove('on')}});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();dragN=0;$('#drop').classList.remove('on');if(e.dataTransfer.files.length)importFiles(e.dataTransfer.files)});
window.addEventListener('hashchange',route);
window.addEventListener('popstate',()=>{if(npOpen)hideNP()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(S.route.n==='home')render()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('Campify installed')});

/* ---------- galaxy background ---------- */
let fxOn=true;try{fxOn=localStorage.getItem('campify-fx')!=='0'}catch(e){}
if(matchMedia('(prefers-reduced-motion: reduce)').matches)fxOn=false;
const FX=(()=>{const cv=$('#stars'),cx=cv.getContext('2d');let W=0,H=0,stars=[],shoot=null,raf=0,last=0;
  function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
    stars=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.25,p:Math.random()*6.28,s:Math.random()*1.5+.4,h:Math.random()<.2?190+Math.random()*100:0}))}
  function draw(t,anim){cx.clearRect(0,0,W,H);
    for(const s of stars){const a=anim?.35+.65*(.5+.5*Math.sin(t/1000*s.s+s.p)):.7;cx.fillStyle=s.h?`hsla(${s.h},100%,80%,${a})`:`rgba(255,255,255,${a})`;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill()}
    if(anim){if(!shoot&&Math.random()<.004)shoot={x:W*(.3+Math.random()*.7),y:Math.random()*H*.4,l:1};
      if(shoot){const k=shoot,g=cx.createLinearGradient(k.x,k.y,k.x+70,k.y-35);g.addColorStop(0,`rgba(255,255,255,${k.l})`);g.addColorStop(1,'rgba(255,255,255,0)');
        cx.strokeStyle=g;cx.lineWidth=1.6;cx.beginPath();cx.moveTo(k.x,k.y);cx.lineTo(k.x+70,k.y-35);cx.stroke();k.x-=11;k.y+=5.5;k.l-=.025;if(k.l<=0)shoot=null}}}
  const loop=t=>{raf=requestAnimationFrame(loop);if(t-last<33)return;last=t;draw(t,true)};
  function run(on){cancelAnimationFrame(raf);raf=0;if(on&&!document.hidden)raf=requestAnimationFrame(loop);else draw(0,false)}
  return{size,run,get w(){return W},get h(){return H}}})();
function setFx(v){fxOn=v;try{localStorage.setItem('campify-fx',v?'1':'0')}catch(e){}document.body.classList.toggle('fx-off',!v);FX.run(v)}
document.addEventListener('visibilitychange',()=>FX.run(fxOn));
addEventListener('resize',()=>{if(innerWidth!==FX.w||Math.abs(innerHeight-FX.h)>150){FX.size();FX.run(fxOn)}});

/* ---------- init ---------- */
(async()=>{
  $$('[data-ic]').forEach(b=>{b.innerHTML=ic(b.dataset.ic);if(b.classList.contains('nl')){const l={home:'Home',search:'Search',music:'Library',queue:'Playlists',plus:'Add music',settings:'Settings'}[b.dataset.ic];b.insertAdjacentHTML('beforeend',`<span>${l}</span>`)}});
  try{
    db=await openDB();
    const [songs,pls,pref]=await Promise.all([dbAll('songs'),dbAll('playlists'),dbGet('meta','prefs')]);
    songs.forEach(s=>S.songs.set(s.id,s));S.pl=pls.sort((a,b)=>a.created-b.created);
    if(pref){S.vol=pref.vol??1;S.shuffle=!!pref.shuffle;S.repeat=pref.repeat||0;
      const q=pref.q;if(q&&q.order&&q.order.length&&q.order.every(i=>S.songs.has(i))&&q.base.every(i=>S.songs.has(i))){S.q=q;S.cur=q.order[q.pos]||null;if(!S.cur)S.q.pos=-1}}
  }catch(e){toast('Storage unavailable in this browser mode')}
  A.volume=S.vol;A.loop=S.repeat===2;
  FX.size();setFx(fxOn);
  route();ui();
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
